<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            font-size: 9px;
        }

        .footer-container {
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .signatures {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            gap: 30px;
        }

        .sig-box {
            text-align: center;
            font-size: 8px;
        }

        .sig-name {
            font-weight: bold;
            font-size: 9px;
            margin-bottom: 2px;
        }

        .sig-title {
            font-size: 7px;
            line-height: 1.3;
        }

        .footer-stamp {
            height: 60px;
        }

        .iso-mark {
            height: 80px;
        }

        .footer-img {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="footer-container">
        <div class="footer-content" id="footer-content-container">
            <!-- Footer content will be injected here -->
        </div>
    </div>
</body>

</html>
