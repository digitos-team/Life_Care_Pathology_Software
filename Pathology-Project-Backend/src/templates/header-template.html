<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            font-size: 9px;
        }

        .header-container {
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .header-content {
            width: 100%;
        }

        .header-content img {
            width: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="header-container">
        <div class="header-content" id="header-img-container">
            <!-- Header image will be injected here -->
        </div>
    </div>
</body>

</html>
